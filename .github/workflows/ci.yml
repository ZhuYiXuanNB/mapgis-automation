name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: selftest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Byte-compile every script
        run: python -m compileall -q skills

      - name: vector-io selftest (5 assertions, no MAPGIS required)
        run: python skills/vector-io/scripts/demo_selftest.py out/

      - name: CLI smoke test
        run: |
          python skills/vector-io/scripts/wt_attrs.py dump --help
          python skills/vector-io/scripts/set_symbol.py --help
          python skills/geochemical-anomaly/grid_filter.py --help

      - name: Upload selftest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-out-py${{ matrix.python-version }}
          path: out/
          if-no-files-found: ignore

name: 缺陷报告 / Bug report
description: 驱动、脚本或文档与实测不符时用这个模板
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        先看一遍 [路线判定表](https://github.com/ZhuYiXuanNB/mapgis-automation/blob/main/SKILL.md) 和 [实测坑清单](https://github.com/ZhuYiXuanNB/mapgis-automation/blob/main/skills/vector-io/reference/pitfalls.md) —— 很多"坏掉了"其实是选错路线或旧缓存。
        **不要上传真实地质数据、项目文件或加密狗信息**，用最小可复现样本或脱敏数据代替。
  - type: dropdown
    id: route
    attributes:
      label: 走的哪条路线
      options:
        - 文件级（纯 Python 读写 .WT/.WL/.WP，不启动 MAPGIS）
        - 界面级（Win32 消息 / drv.ps1 驱动菜单对话框）
        - 混合（geochemical-anomaly：文件备数据 + 界面出图）
        - 文档 / 说明有误
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: Windows 版本 / MAPGIS 版本 / Python 版本
      placeholder: "Windows 10 22H2 / MAPGIS 6.7 / Python 3.14.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 实际发生了什么
      description: 现象 + 完整报错/截图。空白、无内容、点了没反应这类"静默失败"请说明是在哪一步看到的
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望是什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现步骤
      description: 能贴出执行的具体命令最好（例如 python skills/vector-io/scripts/demo_selftest.py out/）
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 已自查
      options:
        - label: 已运行 python skills/vector-io/scripts/demo_selftest.py out/ 且 5 项全部通过
        - label: 文件级问题，改完文件后在 MAPGIS 里做过「移除图层 → 重新添加 → 复位窗口」
        - label: 已确认不是隐藏模态框（错误警告）吞掉了后续命令

name: 需求 / 新能力
description: 想要新的自动化动作、新技能或 MCP 接口
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前先想一下：这件事**能不能自己算出结果**？能 → 文件级（不碰界面）；必须让 MAPGIS 算 → 界面级。见 [路线判定](https://github.com/ZhuYiXuanNB/mapgis-automation/blob/main/SKILL.md)。
  - type: dropdown
    id: layer
    attributes:
      label: 归属层
      options:
        - 文件级能力（.WT/.WL/.WP 读写、属性、注记）
        - 界面级动作（新的 Win32 动作 / 菜单命令）
        - MCP server 语义工具
        - 文档 / 示例 / 验收记录
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 你想完成的整件事
      description: 描述真实工作流，而不是你猜的实现方案。例如"给 2000 个采样点批量标样号并出图"
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: 现在怎么绕
      description: 目前手工做要几步、多久、哪里最容易错
  - type: textarea
    id: accept
    attributes:
      label: 怎样算做完
      description: 可验证的验收标准（截图、字节校验、能重复跑通的命令）
